<svg xmlns="http://www.w3.org/2000/svg" width="300" height="278" viewBox="0 0 300 278" role="img"><rect width="300" height="278" rx="22" fill="#081426"/><rect x="1" y="1" width="298" height="276" rx="21" fill="none" stroke="#274565"/>
        <style><![CDATA[
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            50% {
                opacity: .4;
            }
        }

        @keyframes sweep {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(110%);
            }
        }

        .reveal {
            animation: rise .8s ease-out both;
        }

        .pulse {
            animation: pulse 2.5s infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }
        }
        ]]></style>
        <g class="reveal"><rect x="18" y="18" width="264" height="242" rx="16" fill="#10243c"/><text x="38" y="61" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#59c7ff" >03</text><text x="38" y="111" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#eef6ff" >GROW</text><text x="38" y="145" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#a8bed5" >Always learning</text><text x="38" y="190" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#eef6ff" >Python + Django</text><text x="38" y="219" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#eef6ff" >Next.js + TypeScript</text></g></svg>