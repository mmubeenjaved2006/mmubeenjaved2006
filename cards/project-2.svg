<svg xmlns="http://www.w3.org/2000/svg" width="860" height="148" viewBox="0 0 860 148" role="img"><rect width="860" height="148" rx="22" fill="#081426"/><rect x="1" y="1" width="858" height="146" rx="21" fill="none" stroke="#274565"/>
        <style><![CDATA[
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            50% {
                opacity: .4;
            }
        }

        @keyframes sweep {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(110%);
            }
        }

        .reveal {
            animation: rise .8s ease-out both;
        }

        .pulse {
            animation: pulse 2.5s infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }
        }
        ]]></style>
        <g class="reveal"><rect x="18" y="16" width="824" height="116" rx="14" fill="#10243c"/><text x="38" y="53" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#59c7ff" >PROJECT 02</text><text x="38" y="87" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#eef6ff" >3D Portfolio</text><text x="38" y="113" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#a8bed5" >Interactive personal developer portfolio</text><text x="799" y="84" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#59c7ff" >↗</text></g></svg>