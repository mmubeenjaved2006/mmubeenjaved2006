<svg xmlns="http://www.w3.org/2000/svg" width="900" height="408" viewBox="0 0 900 408" role="img"><rect width="900" height="408" rx="22" fill="#081426"/><rect x="1" y="1" width="898" height="406" rx="21" fill="none" stroke="#274565"/>
        <style><![CDATA[
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            50% {
                opacity: .4;
            }
        }

        @keyframes sweep {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(110%);
            }
        }

        .reveal {
            animation: rise .8s ease-out both;
        }

        .pulse {
            animation: pulse 2.5s infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }
        }
        ]]></style>
        <circle cx="52" cy="49" r="6" fill="#59c7ff" class="pulse"/><text x="68" y="56" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#59c7ff" >OPEN TO INTERNSHIPS &amp; COLLABORATIONS</text><g class="reveal"><text x="48" y="143" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" fill="#eef6ff" >MUBEEN JAVED</text><text x="50" y="194" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#59c7ff" >MERN STACK DEVELOPER</text><text x="50" y="244" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#a8bed5" >I build polished, practical full-stack web applications.</text><text x="50" y="278" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#a8bed5" >React  /  Node.js  /  Express  /  MongoDB</text><text x="50" y="327" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#eef6ff" >Based in Lahore, Pakistan  ·  BSFT at ITU Lahore</text></g><path d="M50 351 H850" stroke="#284563"/><text x="50" y="381" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#59c7ff" >github.com/mmubeenjaved2006</text></svg>